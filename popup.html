<!DOCTYPE html>
<html>
<head>
    <title>Part Number Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"> <!-- Google Fonts API -->
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif; /* Tüm metinler için font */
            padding: 10px;
            background-color: #121212; /* Koyu arka plan rengi */
            color: #e0e0e0; /* Açık metin rengi */
            width: 300px; /* Popup genişliği */
        }
        #partList {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            background-color: #1e1e1e; /* Koyu arka plan rengi */
            border: 1px solid #333; /* Sınır rengi */
        }
        .part-item {
            margin: 5px 0;
            padding: 5px;
            background-color: #2c2c2c; /* Koyu arka plan rengi */
            color: #e0e0e0; /* Açık metin rengi */
            display: flex;
            justify-content: space-between;
            border: 1px solid #333; /* Sınır rengi */
        }
        .input-container {
            display: flex;
            align-items: center; /* Dikey ortalama */
            gap: 5px; /* Input ve buton arasına boşluk */
        }
        input[type="text"] {
            background-color: #2c2c2c; /* Koyu arka plan rengi */
            color: #e0e0e0; /* Açık metin rengi */
            border: 1px solid #333; /* Sınır rengi */
            padding: 5px;
            width: 200px; /* Text box genişliği */
        }
        button {
            background-color: #4caf50; /* Buton arka plan rengi */
            color: #fff; /* Buton metin rengi */
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049; /* Buton hover rengi */
        }
        h3 {
            font-family: 'Roboto', Arial, sans-serif; /* Başlık fontu */
            margin-top: 0;
            margin-bottom: 10px; /* Başlık ile diğer elemanlar arasında boşluk */
        }
        #partListHeader {
            margin-top: 20px; /* Başlık ile listedeki öğeler arasındaki boşluk */
            margin-bottom: 10px; /* Başlık ile diğer elemanlar arasındaki boşluk */
            font-weight: 700; /* Başlık kalın yazı tipi */
        }
    </style>
</head>
<body>
    <h3>Manage Part Numbers</h3>
    <div class="input-container">
        <input type="text" id="partNumberInput" placeholder="Enter part number">
        <button id="addPartButton">Add Part</button>
    </div>
    <div id="partListHeader">Total Items: 0</div> <!-- Eklenen toplam sayıyı gösterecek başlık -->
    <ul id="partList"></ul>
    <script src="popup.js"></script>
</body>
</html>
